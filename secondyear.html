<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2nd Year Notes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Manrope:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#070b10;
    --panel:#0c1219;
    --line:#1a2532;
    --cyan:#33dfff;
    --cyan-dim:#123842;
    --amber:#ffb454;
    --text:#e4eef2;
    --text-dim:#6d8894;
  }
 
  *{box-sizing:border-box;}
 
  @property --angle{
    syntax:'<angle>';
    initial-value:0deg;
    inherits:false;
  }
 
  body{
    margin:0;
    min-height:100vh;
    font-family:'Manrope', sans-serif;
    background:var(--bg);
    color:var(--text);
    text-align:center;
    position:relative;
    overflow-x:hidden;
    display:flex;
    flex-direction:column;
    align-items:center;
  }
 
  h1, .eyebrow, .download-btn span{ font-family:'Outfit', sans-serif; }
 
  /* soft ambient glow, no grid/noise */
  body::before{
    content:"";
    position:fixed;
    top:-10%; left:50%;
    width:900px; height:600px;
    transform:translateX(-50%);
    background:radial-gradient(ellipse at center, rgba(51,223,255,0.10), transparent 65%);
    pointer-events:none;
    z-index:0;
  }
 
  /* ---------- wavy name watermark ---------- */
  .name-bg{
    position:fixed;
    inset:0;
    z-index:0;
    display:flex;
    flex-direction:column;
    justify-content:space-evenly;
    overflow:hidden;
    opacity:0.055;
    pointer-events:none;
    user-select:none;
  }
  .name-row{
    display:flex;
    justify-content:center;
    white-space:nowrap;
    font-family:'Outfit', sans-serif;
    font-weight:700;
    font-size:44px;
    letter-spacing:3px;
    color:var(--cyan);
  }
  .name-row span{
    display:inline-block;
    animation:wave 2.6s ease-in-out infinite;
  }
  @keyframes wave{
    0%, 100%{ transform:translateY(0); }
    50%{ transform:translateY(-12px); }
  }
 
  @media (max-width:520px){
    .name-row{ font-size:26px; letter-spacing:1.5px; }
  }
 
  /* ---------- lightning ---------- */
  .flash-overlay{
    position:fixed;
    inset:0;
    background:radial-gradient(ellipse at 30% 0%, rgba(140,235,255,0.5), transparent 60%);
    opacity:0;
    pointer-events:none;
    z-index:0;
    animation:screenflash 7s ease-in-out infinite;
  }
  @keyframes screenflash{
    0%, 91%{ opacity:0; }
    91.5%{ opacity:0.55; }
    92%{ opacity:0.05; }
    92.7%{ opacity:0.4; }
    93.4%{ opacity:0; }
    100%{ opacity:0; }
  }
 
  .bolt{
    position:fixed;
    pointer-events:none;
    z-index:0;
    filter:drop-shadow(0 0 6px rgba(51,223,255,0.9)) drop-shadow(0 0 16px rgba(51,223,255,0.5));
    opacity:0;
  }
  .bolt path{
    fill:none;
    stroke:#c6f6ff;
    stroke-width:2.4;
    stroke-linecap:round;
    stroke-linejoin:round;
  }
  .bolt.b1{ top:0; left:12%; width:70px; animation:strike1 7s ease-in-out infinite; }
  .bolt.b2{ top:0; right:16%; width:50px; animation:strike2 11s ease-in-out infinite 2.3s; }
  .bolt.b3{ top:0; left:50%; width:60px; transform:translateX(-50%) scaleX(-1); animation:strike3 13s ease-in-out infinite 5.1s; }
 
  @keyframes strike1{
    0%, 90%{ opacity:0; }
    90.5%{ opacity:1; }
    91%{ opacity:0.15; }
    91.6%{ opacity:0.9; }
    92.3%{ opacity:0.1; }
    93%{ opacity:0.7; }
    95%{ opacity:0; }
    100%{ opacity:0; }
  }
  @keyframes strike2{
    0%, 93%{ opacity:0; }
    93.4%{ opacity:0.85; }
    93.9%{ opacity:0.1; }
    94.5%{ opacity:0.6; }
    96%{ opacity:0; }
    100%{ opacity:0; }
  }
  @keyframes strike3{
    0%, 95%{ opacity:0; }
    95.3%{ opacity:0.8; }
    95.8%{ opacity:0.1; }
    96.4%{ opacity:0.55; }
    98%{ opacity:0; }
    100%{ opacity:0; }
  }
 
  @media (max-width:520px){
    .bolt{ width:38px !important; }
  }
 
  /* ---------- animated book background ---------- */
  .book-decor{
    position:fixed;
    top:50%; left:50%;
    transform:translate(-50%,-50%);
    width:340px; height:230px;
    perspective:1400px;
    opacity:0.16;
    pointer-events:none;
    z-index:0;
  }
  .book{
    position:relative;
    width:100%; height:100%;
    transform-style:preserve-3d;
  }
  .cover, .stack{
    position:absolute;
    top:0; width:50%; height:100%;
    background:linear-gradient(135deg, var(--cyan-dim), #081217);
    border:1px solid var(--line);
  }
  .cover.left{ left:0; border-radius:6px 0 0 6px; }
  .cover.right{ right:0; border-radius:0 6px 6px 0; }
  .spine{
    position:absolute;
    left:50%; top:2%;
    width:4px; height:96%;
    transform:translateX(-50%);
    background:var(--line);
  }
  .page{
    position:absolute;
    top:2%; left:50%;
    width:48%; height:96%;
    background:linear-gradient(90deg, #0d1620, #142330);
    border:1px solid var(--line);
    border-radius:0 4px 4px 0;
    transform-origin:left center;
    transform-style:preserve-3d;
    backface-visibility:hidden;
    animation:flip 6s ease-in-out infinite;
  }
  .page:nth-child(4){ animation-delay:0s; z-index:5; }
  .page:nth-child(5){ animation-delay:1.5s; z-index:4; }
  .page:nth-child(6){ animation-delay:3s; z-index:3; }
  @keyframes flip{
    0%, 8%{ transform:rotateY(0deg); }
    45%, 55%{ transform:rotateY(-175deg); }
    92%, 100%{ transform:rotateY(-180deg); }
  }
 
  @media (max-width:520px){
    .book-decor{ width:220px; height:150px; opacity:0.12; }
  }
 
  /* ---------- content ---------- */
  .wrap{
    position:relative;
    z-index:1;
    padding:0 20px 56px;
    width:100%;
  }
 
  .eyebrow{
    display:inline-flex;
    align-items:center;
    gap:7px;
    margin-top:48px;
    padding:6px 14px;
    border:1px solid var(--cyan-dim);
    border-radius:999px;
    font-size:12px;
    font-weight:500;
    letter-spacing:1.5px;
    color:var(--cyan);
    opacity:0;
    animation:rise 0.55s ease forwards;
  }
  .eyebrow .dot{
    width:6px; height:6px; border-radius:50%;
    background:var(--cyan);
    box-shadow:0 0 8px var(--cyan);
  }
 
  h1{
    margin:20px auto 8px;
    max-width:520px;
    font-size:clamp(28px, 5vw, 38px);
    font-weight:700;
    letter-spacing:-0.5px;
    line-height:1.15;
    opacity:0;
    animation:rise 0.55s ease 0.08s forwards;
  }
  h1 span{ color:var(--cyan); }
 
  .byline{
    font-size:13.5px;
    color:var(--text-dim);
    letter-spacing:0.2px;
    opacity:0;
    animation:rise 0.55s ease 0.16s forwards;
  }
 
  @keyframes rise{
    from{ opacity:0; transform:translateY(8px); }
    to{ opacity:1; transform:translateY(0); }
  }
 
  .box{
    position:relative;
    max-width:420px;
    margin:40px auto 0;
    padding:32px 28px 26px;
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:18px;
    box-shadow:0 24px 50px -22px rgba(0,0,0,0.65);
    opacity:0;
    animation:rise 0.6s ease 0.24s forwards;
    isolation:isolate;
  }
 
  .box::before{
    content:"";
    position:absolute;
    inset:-2px;
    border-radius:20px;
    padding:2px;
    background:conic-gradient(from var(--angle), #33dfff, #7c5cff, #ff6ec7, #ffb454, #7dff9e, #33dfff);
    -webkit-mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite:xor;
    mask-composite:exclude;
    animation:spinBorder 5s linear infinite;
    z-index:-1;
    pointer-events:none;
    filter:saturate(1.15);
  }
  @keyframes spinBorder{
    to{ --angle:360deg; }
  }
 
  .trace{
    display:flex;
    align-items:center;
    justify-content:center;
    margin-bottom:24px;
  }
  .node{
    width:9px; height:9px;
    border-radius:50%;
    background:var(--line);
    border:1px solid var(--text-dim);
    transition:all 0.35s ease;
    flex-shrink:0;
  }
  .node.done{
    background:var(--cyan);
    border-color:var(--cyan);
    box-shadow:0 0 9px var(--cyan);
  }
  .link{
    flex:1;
    height:2px;
    background:var(--line);
    margin:0 6px;
    overflow:hidden;
    position:relative;
  }
  .link::after{
    content:"";
    position:absolute; inset:0;
    background:var(--cyan);
    transform:translateX(-100%);
    transition:transform 0.4s ease;
  }
  .link.live::after{ transform:translateX(0); }
 
  .field{ text-align:left; margin-bottom:18px; }
  .field label{
    display:block;
    font-size:12px;
    font-weight:600;
    letter-spacing:0.6px;
    color:var(--text-dim);
    margin-bottom:7px;
  }
  .field label .req{ color:var(--amber); }
 
  select{
    width:100%;
    padding:13px 14px;
    border-radius:10px;
    background:#0a1017;
    color:var(--text);
    border:1px solid var(--line);
    font-size:15px;
    font-family:'Manrope', sans-serif;
    appearance:none;
    -webkit-appearance:none;
    background-image:linear-gradient(45deg, transparent 50%, var(--cyan) 50%), linear-gradient(135deg, var(--cyan) 50%, transparent 50%);
    background-position: calc(100% - 20px) center, calc(100% - 15px) center;
    background-size:5px 5px, 5px 5px;
    background-repeat:no-repeat;
    transition:border-color 0.2s ease, box-shadow 0.2s ease;
    cursor:pointer;
  }
  select:hover{ border-color:var(--cyan-dim); }
  select:focus{
    outline:none;
    border-color:var(--cyan);
    box-shadow:0 0 0 3px rgba(51,223,255,0.12);
  }
  select option{ background:#0c1219; color:var(--text); }
 
  .download-btn{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:9px;
    margin-top:24px;
    padding:15px;
    border-radius:11px;
    border:1px solid var(--cyan);
    color:var(--cyan);
    font-weight:600;
    font-size:14.5px;
    letter-spacing:0.2px;
    cursor:pointer;
    background:transparent;
    transition:background 0.2s ease, color 0.2s ease, transform 0.15s ease;
    user-select:none;
  }
  .download-btn:hover{ background:var(--cyan); color:#04141a; }
  .download-btn:active{ transform:scale(0.98); }
  .download-btn svg{ transition:transform 0.2s ease; }
  .download-btn:hover svg{ transform:translateY(2px); }
 
  .status{
    margin-top:13px;
    min-height:17px;
    font-size:12.5px;
    letter-spacing:0.2px;
    color:var(--text-dim);
    opacity:0;
    transition:opacity 0.25s ease;
  }
  .status.show{ opacity:1; }
  .status.warn{ color:var(--amber); }
  .status.ok{ color:var(--cyan); }
 
  .back{
    display:inline-block;
    margin-top:28px;
    font-size:13.5px;
    color:var(--text-dim);
    text-decoration:none;
    letter-spacing:0.2px;
    transition:color 0.2s ease;
    opacity:0;
    animation:rise 0.55s ease 0.32s forwards;
  }
  .back:hover{ color:var(--cyan); }
  .back::before{ content:"← "; }
 
  @media (prefers-reduced-motion: reduce){
    *, *::before, *::after{
      animation-duration:0.001ms !important;
      animation-iteration-count:1 !important;
      transition-duration:0.001ms !important;
    }
    .bolt, .flash-overlay{ display:none; }
    .box::before{ animation:none; --angle:0deg; }
    .name-row span{ animation:none; }
  }
</style>
</head>
<body>
 
<div class="name-bg" id="nameBg" aria-hidden="true"></div>
 
<div class="flash-overlay" aria-hidden="true"></div>
 
<svg class="bolt b1" viewBox="0 0 40 120" aria-hidden="true">
  <path d="M22 0 L6 52 L20 52 L14 120 L36 46 L20 46 Z"/>
</svg>
<svg class="bolt b2" viewBox="0 0 40 120" aria-hidden="true">
  <path d="M22 0 L6 52 L20 52 L14 120 L36 46 L20 46 Z"/>
</svg>
<svg class="bolt b3" viewBox="0 0 40 120" aria-hidden="true">
  <path d="M22 0 L6 52 L20 52 L14 120 L36 46 L20 46 Z"/>
</svg>
 
<div class="book-decor" aria-hidden="true">
  <div class="book">
    <div class="cover left"></div>
    <div class="cover right"></div>
    <div class="spine"></div>
    <div class="page"></div>
    <div class="page"></div>
    <div class="page"></div>
  </div>
</div>
 
<div class="wrap">
  <span class="eyebrow"><span class="dot"></span>SEM III · ENGINEERING ARCHIVE</span>
  <h1>2nd Year <span>Notes Library</span></h1>
  <p class="byline">maintained by Mohd Sameer</p>
 
  <div class="box">
    <div class="trace">
      <div class="node" id="node1"></div>
      <div class="link" id="link1"></div>
      <div class="node" id="node2"></div>
      <div class="link" id="link2"></div>
      <div class="node" id="node3"></div>
    </div>
 
    <div class="field">
      <label for="subject">SUBJECT <span class="req">*</span></label>
      <select id="subject">
        <option value="">-- Select Subject --</option>
        <option value="dstl">DSTL</option>
        <option value="ds">Data Structures</option>
        <option value="si">Sensor &amp; Instrumentation</option>
        <option value="coa">COA</option>
        <option value="tc">Technical Communication</option>
        <option value="python">Python</option>
      </select>
    </div>
 
    <div class="field">
      <label for="unit">UNIT <span class="req">*</span></label>
      <select id="unit">
        <option value="">-- Select Unit --</option>
        <option value="unit1">Unit 1</option>
        <option value="unit2">Unit 2</option>
        <option value="unit3">Unit 3</option>
        <option value="unit4">Unit 4</option>
        <option value="unit5">Unit 5</option>
      </select>
    </div>
 
    <div class="download-btn" id="downloadBtn">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
      <span>Download Notes (PDF)</span>
    </div>
    <div class="status" id="status"></div>
  </div>
 
  <a class="back" href="index.html">Back to Home</a>
</div>
 
<script>
  (function buildNameBg(){
    const container = document.getElementById("nameBg");
    const text = "MOHD SAMEER";
    const rows = 6;
    const repeats = 3;
    let globalIndex = 0;
    for(let r = 0; r < rows; r++){
      const row = document.createElement("div");
      row.className = "name-row";
      const full = Array(repeats).fill(text).join("   •   ");
      for(const ch of full){
        const span = document.createElement("span");
        span.textContent = ch === " " ? "\u00A0" : ch;
        span.style.animationDelay = (globalIndex % 14) * 0.09 + "s";
        row.appendChild(span);
        globalIndex++;
      }
      container.appendChild(row);
    }
  })();
 
  const subjectEl = document.getElementById("subject");
  const unitEl = document.getElementById("unit");
  const statusEl = document.getElementById("status");
  const node1 = document.getElementById("node1");
  const node2 = document.getElementById("node2");
  const node3 = document.getElementById("node3");
  const link1 = document.getElementById("link1");
  const link2 = document.getElementById("link2");
 
  function updateTrace(){
    const hasSubject = subjectEl.value !== "";
    const hasUnit = unitEl.value !== "";
    node1.classList.toggle("done", hasSubject);
    link1.classList.toggle("live", hasSubject);
    node2.classList.toggle("done", hasUnit);
    link2.classList.toggle("live", hasSubject && hasUnit);
    node3.classList.toggle("done", hasSubject && hasUnit);
  }
 
  function setStatus(msg, type){
    statusEl.textContent = msg;
    statusEl.className = "status show" + (type ? " " + type : "");
  }
 
  subjectEl.addEventListener("change", () => { updateTrace(); if(statusEl.classList.contains("show")) setStatus("", ""); });
  unitEl.addEventListener("change", () => { updateTrace(); if(statusEl.classList.contains("show")) setStatus("", ""); });
 
  document.getElementById("downloadBtn").addEventListener("click", downloadNotes);
 
  function downloadNotes(){
    const subject = subjectEl.value;
    const unit = unitEl.value;
    if(subject === "" || unit === ""){
      setStatus("⚠ select a subject and unit first", "warn");
      const box = document.querySelector(".box");
      box.animate(
        [{ transform:"translateX(0)" }, { transform:"translateX(-6px)" }, { transform:"translateX(6px)" }, { transform:"translateX(0)" }],
        { duration:280, easing:"ease-in-out" }
      );
      return;
    }
    setStatus("→ opening " + subject + "/" + unit + ".pdf", "ok");
    const filePath = `notes/${subject}/${unit}.pdf`;
    window.open(filePath, "_blank");
  }
</script>
</body>
</html>
