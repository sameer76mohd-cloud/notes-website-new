<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Notes Store</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

/* ===== BODY ===== */
body{
    font-family: 'Segoe UI', Arial, sans-serif;
    height:100vh;
    overflow:hidden;
    color:white;
    text-align:center;
    background: linear-gradient(120deg,#020024,#090979,#00d4ff);
    background-size: 400% 400%;
    animation: gradientMove 18s ease infinite;
}

/* ===== BACKGROUND WAVES ===== */
.wave{
    position:fixed;
    width:200%;
    height:200%;
    background: radial-gradient(circle at center, rgba(0,255,255,0.12), transparent 60%);
    animation: waveMove 20s linear infinite;
    z-index:-1;
}
.wave:nth-child(1){ animation-duration:25s; opacity:0.5;}
.wave:nth-child(2){ animation-duration:40s; opacity:0.3;}

@keyframes gradientMove{
    0%{background-position:0% 50%;}
    50%{background-position:100% 50%;}
    100%{background-position:0% 50%;}
}

@keyframes waveMove{
    from{transform:rotate(0deg);}
    to{transform:rotate(360deg);}
}

/* ===== TITLE ===== */
h1{
    margin-top:40px;
    font-size:42px;
    letter-spacing:3px;
    text-shadow:0 0 25px cyan;
}

/* ===== CARDS ===== */
.container{
    display:flex;
    flex-direction:column;
    gap:28px;
    padding:55px;
    max-width:420px;
    margin:auto;
}

.card{
    backdrop-filter: blur(12px);
    background: rgba(255,255,255,0.08);
    border-radius:20px;
    padding:38px 20px;
    border:1px solid rgba(0,255,255,0.4);
    box-shadow:0 0 35px rgba(0,255,255,0.35);
    transition:0.4s;
}

.card:hover{
    transform:translateY(-8px) scale(1.05);
    box-shadow:0 0 55px cyan;
}

/* ===== TEXT ===== */
.card h2{
    font-size:23px;
    letter-spacing:1px;
}

/* ===== OWNER ===== */
.owner-name{
    font-size:30px;
    margin-top:15px;
    color:#00ffff;
    text-shadow:0 0 18px cyan;
}

/* ===== FOOTER ===== */
footer{
    margin-top:45px;
    opacity:0.85;
}

/* ===== MOBILE ===== */
@media(max-width:600px){
    h1{font-size:32px;}
    .owner-name{font-size:24px;}
}
</style>
</head>

<body>

<!-- BACKGROUND EFFECT -->
<div class="wave"></div>
<div class="wave"></div>

<h1>NOTES STORE</h1>

<div class="container">

    <a href="secondyear.html" style="text-decoration:none;color:white;">
        <div class="card">
            <h2>2nd Year Notes</h2>
        </div>
    </a>

    <div class="card">
        <h2>PYQs</h2>
    </div>

</div>

<footer>
    <h2 class="owner-name">by Mohd Sameer</h2>
</footer>

</body>
</html>
