<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Notes Store</title>

<style>
/* ===== RESET ===== */
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

/* ===== BODY ===== */
body{
    font-family: Arial, sans-serif;
    background: radial-gradient(circle at top, #0f2027, #000);
    color:white;
    text-align:center;
    overflow:hidden;
    perspective:1200px;
}

/* ===== BACKGROUND ANIMATION ===== */
.bg-animation{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    z-index:-1;
    overflow:hidden;
}

/* 🔥 BIGGER BALLS */
.bg-animation span{
    position:absolute;
    width:20px;
    height:20px;
    background:cyan;
    border-radius:50%;
    opacity:0.8;
    animation: float 18s linear infinite;
    box-shadow:0 0 15px cyan;
}

/* 🔥 MORE BALLS (12) */
.bg-animation span:nth-child(1){ left:5%;  animation-delay:0s;}
.bg-animation span:nth-child(2){ left:15%; animation-delay:2s;}
.bg-animation span:nth-child(3){ left:25%; animation-delay:4s;}
.bg-animation span:nth-child(4){ left:35%; animation-delay:6s;}
.bg-animation span:nth-child(5){ left:45%; animation-delay:8s;}
.bg-animation span:nth-child(6){ left:55%; animation-delay:10s;}
.bg-animation span:nth-child(7){ left:65%; animation-delay:12s;}
.bg-animation span:nth-child(8){ left:75%; animation-delay:14s;}
.bg-animation span:nth-child(9){ left:85%; animation-delay:16s;}
.bg-animation span:nth-child(10){ left:95%; animation-delay:1s;}
.bg-animation span:nth-child(11){ left:50%; animation-delay:5s;}
.bg-animation span:nth-child(12){ left:30%; animation-delay:9s;}

@keyframes float{
    0%{
        top:110%;
        transform:scale(0.6) translateZ(0);
    }
    100%{
        top:-10%;
        transform:scale(1.4) translateZ(200px);
    }
}

/* ===== TITLE ===== */
h1{
    margin-top:40px;
    font-size:42px;
    letter-spacing:2px;
    text-shadow:0 0 20px cyan;
}

/* ===== CONTAINER ===== */
.container{
    display:flex;
    flex-direction:column;
    gap:30px;
    padding:60px 20px;
    max-width:420px;
    margin:auto;
    transform-style:preserve-3d;
}

/* ===== 3D CARDS ===== */
.card{
    background:rgba(0,255,255,0.08);
    border:1px solid cyan;
    border-radius:18px;
    padding:40px 20px;
    cursor:pointer;
    transition:transform 0.4s ease, box-shadow 0.4s ease;
    box-shadow:0 15px 30px rgba(0,255,255,0.3);
    transform-style:preserve-3d;
}

.card:hover{
    transform:
        rotateX(12deg)
        rotateY(-12deg)
        translateZ(40px)
        scale(1.05);
    box-shadow:0 35px 60px rgba(0,255,255,0.7);
}

.card h2{
    font-size:24px;
    transform:translateZ(30px);
}

/* ===== FOOTER ===== */
footer{
    margin-top:30px;
}

.owner-name{
    font-size:28px;
    color:#00ffff;
    text-shadow:0 0 15px cyan;
}

/* ===== MOBILE ===== */
@media(max-width:600px){
    h1{ font-size:32px; }
    .owner-name{ font-size:22px; }
}
</style>
</head>

<body>

<!-- BACKGROUND BALLS -->
<div class="bg-animation">
    <span></span><span></span><span></span><span></span>
    <span></span><span></span><span></span><span></span>
    <span></span><span></span><span></span><span></span>
</div>

<h1>NOTES STORE</h1>

<div class="container">

    <a href="secondyear.html" style="text-decoration:none;color:white;">
        <div class="card">
            <h2>2nd Year Notes</h2>
        </div>
    </a>

    <div class="card">
        <h2>PYQs</h2>
    </div>

</div>

<footer>
    <h2 class="owner-name">by Mohd Sameer</h2>
</footer>

</body>
</html>
